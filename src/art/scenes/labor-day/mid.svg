<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900">
<!-- Labor Day · mid. Concept: "the thank-you picnic" on the last long weekend of summer at the town park. Focal point: the picnic (x 100–1250, y 600–880) the neighbors put on for the people who keep the town running — under a striped pavilion a girl hands a heart card to the mail carrier; a boy in a yellow toy hard hat brings lemonade to a nurse in blue scrubs; dad in an apron flips burgers on the grill beside a picnic table with watermelon, corn and a jug of lemonade; a firefighter in her yellow coat lets a toddler try on the big red helmet beside the red fire engine; a dog with a frisbee. A crane far off over the round park trees. Light story: warm late-summer sun. The confetti is the effect's. -->
<defs><linearGradient id="labor-day-lawn" x2="0" y2="1"><stop stop-color="#8ad06a"/><stop offset="1" stop-color="#5aa84a"/></linearGradient><linearGradient id="labor-day-truck" x2="0" y2="1"><stop stop-color="#ff4a4a"/><stop offset="1" stop-color="#b81a1a"/></linearGradient><linearGradient id="labor-day-wood" x2="0" y2="1"><stop stop-color="#c8945a"/><stop offset="1" stop-color="#9a6a3a"/></linearGradient></defs>
