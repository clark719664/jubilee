<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900">
<!-- New Year's Day · back: the night sky fading to a pink-gold dawn; the first sun of the year rising out of a calm sea with a glittering path of light; a far headland with a lighthouse and its beam on the left; a few last stars in the corners -->
<defs><radialGradient id="new-years-day-dawn"><stop stop-color="#ffd28a" stop-opacity=".95"/><stop offset=".25" stop-color="#ff9a7a" stop-opacity=".75"/><stop offset=".6" stop-color="#b86aa0" stop-opacity=".35"/><stop offset="1" stop-color="#b86aa0" stop-opacity="0"/></radialGradient><linearGradient id="new-years-day-band" x2="0" y2="1"><stop stop-color="#b86aa0" stop-opacity="0"/><stop offset=".6" stop-color="#e88a8a" stop-opacity=".3"/><stop offset="1" stop-color="#ffb48a" stop-opacity=".65"/></linearGradient><radialGradient id="new-years-day-sun" cy=".6" r=".6"><stop stop-color="#fff6d0"/><stop offset=".55" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb84a"/></radialGradient><radialGradient id="new-years-day-halo"><stop stop-color="#fff0b0" stop-opacity=".7"/><stop offset=".4" stop-color="#ffd28a" stop-opacity=".3"/><stop offset="1" stop-color="#ffd28a" stop-opacity="0"/></radialGradient><linearGradient id="new-years-day-sea" x2="0" y2="1"><stop stop-color="#6a5a8a"/><stop offset=".4" stop-color="#3a4a7a"/><stop offset="1" stop-color="#24486a"/></linearGradient><radialGradient id="new-years-day-beam" cx="1" r="1"><stop stop-color="#fff3c4" stop-opacity=".5"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient></defs>
<!-- the last stars, in the corners only -->
<path d="M264 103a1 1 0 1 0 3 0a1 1 0 1 0-3 0zm1076-25a2 2 0 1 0 3 0a2 2 0 1 0-3 0zm-1305 185a2 2 0 1 0 4 0a2 2 0 1 0-4 0zm1470-51a2 2 0 1 0 3 0a2 2 0 1 0-3 0zm-1293 27a2 2 0 1 0 3 0a2 2 0 1 0-3 0zm1307-114a2 2 0 1 0 3 0a2 2 0 1 0-3 0zm-1307 128a2 2 0 1 0 5 0a2 2 0 1 0-5 0zm1233-146a2 2 0 1 0 4 0a2 2 0 1 0-4 0zm-1358 101a2 2 0 1 0 3 0a2 2 0 1 0-3 0zm1325-74a1 1 0 1 0 2 0a1 1 0 1 0-2 0zm-1267 21a2 2 0 1 0 4 0a2 2 0 1 0-4 0zm1199 67a2 2 0 1 0 3 0a2 2 0 1 0-3 0zm-1240-65a1 1 0 1 0 2 0a1 1 0 1 0-2 0zm1383-67a2 2 0 1 0 4 0a2 2 0 1 0-4 0zm-1434 168a2 2 0 1 0 4 0a2 2 0 1 0-4 0zm1514-150a1 1 0 1 0 3 0a1 1 0 1 0-3 0zm-1374 37a1 1 0 1 0 2 0a1 1 0 1 0-2 0zm1333 114a1 1 0 1 0 2 0a1 1 0 1 0-2 0zm-1382-13a2 2 0 1 0 4 0a2 2 0 1 0-4 0zm1324 20a1 1 0 1 0 3 0a1 1 0 1 0-3 0zm-1246-156a2 2 0 1 0 3 0a2 2 0 1 0-3 0zm1286-89a1 1 0 1 0 3 0a1 1 0 1 0-3 0zm-1358 196a2 2 0 1 0 4 0a2 2 0 1 0-4 0zm1188-82a2 2 0 1 0 4 0a2 2 0 1 0-4 0zm-1059 38a1 1 0 1 0 3 0a1 1 0 1 0-3 0zm1231 39a1 1 0 1 0 3 0a1 1 0 1 0-3 0z" fill="#fff6d8" opacity=".8"/>
<!-- the dawn glow on the horizon (kept below the copy zone) -->
<path d="M-20 432h1640v180h-1640z" fill="url(#new-years-day-band)"/><ellipse cx="800" cy="612" rx="1100" ry="180" fill="url(#new-years-day-dawn)"/>
<!-- the rising sun and its halo -->
<circle cx="800" cy="612" r="198" fill="url(#new-years-day-halo)"/><path d="M696 612a104 104 0 0 1 208 0z" fill="url(#new-years-day-sun)"/>
<!-- the sea, with the sun's glittering path -->
<path d="M-20 612h1640v168h-1640z" fill="url(#new-years-day-sea)"/><path d="M-20 612h1640v3h-1640z" fill="#ffd28a" opacity=".7"/><path d="M787 618h37v2.4h-37zm13 5h26v2.4h-26zm-2 6h34v2.4h-34zm-24 6h49v2.4h-49zm-11 6h36v2.4h-36zm-1 7h38v2.4h-38zm-11 7h55v2.4h-55zm44 8h64v2.4h-64zm-37 8h64v2.4h-64zm24 8h62v2.4h-62zm-40 9h76v2.4h-76zm40 9h75v2.4h-75zm12 10h78v2.4h-78zm-18 10h89v2.4h-89zm3 10h76v2.4h-76zm-65 11h95v2.4h-95zm70 11h88v2.4h-88zm30 12h94v2.4h-94zm-128 12h108v2.4h-108zm47 12h109v2.4h-109zm10 13h116v2.4h-116zm33 13h103v2.4h-103zm31 14h107v2.4h-107zm-58 14h122v2.4h-122zm36 14h123v2.4h-123zm-85 15h126v2.4h-126z" fill="#ffc85a" opacity=".85"/>
<!-- far islands on the right -->
<path d="M1280 612q40-26 90-20q30-14 60 4q20 6 30 16z" fill="#3a2f56"/>
<!-- the headland and lighthouse on the left, its beam sweeping out to sea -->
<path d="M-20 652v-92q80-20 160-12q80 4 122 32q28 20 50 72z" fill="#322643"/><path d="M146 436l-166-64v116z" fill="url(#new-years-day-beam)"/><path d="M132 556l8-104h20l8 104z" fill="#f4eee8"/><path d="M134 528h32l1 12h-34zm3-40h26l1 12h-28z" fill="#d62838"/><path d="M136 452h28v-6h-28zm4-6v-16h20v16z" fill="#2a2a3a"/><path d="M142 444v-12h16v12z" fill="#fff3c4"/><path d="M136 430q14-16 28 0z" fill="#d62838"/><circle cx="150" cy="438" r="16" fill="url(#new-years-day-halo)"/>
</svg>
