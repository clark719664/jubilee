<!-- the sun and two clouds, in the corners -->
<circle cx="140" cy="120" r="120" fill="url(#childrens-day-japan-sun)"/><circle cx="140" cy="120" r="46" fill="#fffbe8"/><path d="M1380 140c-24 0-30-30-6-36c0-26 36-32 46-12c14-18 46-10 44 16c22-2 28 24 12 32z" fill="#ffffff" opacity=".9"/>
