<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900">
<!-- Children's Day (Japan) · mid. Concept: "carp in the sky" on a bright May morning in a family garden. Focal point: the tall koinobori pole (x 700–1220, y 80–760) with its spinning arrow-wheel, the five-colored fukinagashi and a family of carp streamers rippling in the wind — the black father, the red mother and the blue child. On the engawa of the house on the left a little boy in a folded-paper samurai helmet holds a toy sword, his sister holds up kashiwa-mochi wrapped in an oak leaf, grandpa in a yukata sits by the small kabuto helmet on its stand. Real carp swim in the pond under a red arched bridge with purple irises; a girl runs with a little orange carp on a stick. Mount Fuji rises far away. Light story: clear spring sunshine. The little carp swimming free are the effect's. -->
<defs><linearGradient id="childrens-day-japan-lawn" x2="0" y2="1"><stop stop-color="#7ac86a"/><stop offset="1" stop-color="#4aa850"/></linearGradient><linearGradient id="childrens-day-japan-pond" x2="0" y2="1"><stop stop-color="#7ad0e8"/><stop offset="1" stop-color="#3a98c8"/></linearGradient><linearGradient id="childrens-day-japan-wood" x2="0" y2="1"><stop stop-color="#c89a6a"/><stop offset="1" stop-color="#9a6a3a"/></linearGradient><linearGradient id="childrens-day-japan-roof" x2="0" y2="1"><stop stop-color="#5a6a7a"/><stop offset="1" stop-color="#3a4a5a"/></linearGradient><linearGradient id="childrens-day-japan-pole"><stop stop-color="#d8c8a8"/><stop offset=".5" stop-color="#fff4dc"/><stop offset="1" stop-color="#b8a888"/></linearGradient></defs>
