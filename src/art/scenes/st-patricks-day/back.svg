<path d="M150 470v-98h14v-12h12v12h12v-12h12v12h14v110zm60 0v-70h44v-8h10v8h10v74zm-78 0v-58h18v60z" fill="#459d7b"/><path d="M164 406a8 10 0 0 1 16 0v14h-16zm62 14a6 8 0 0 1 12 0v10h-12z" fill="#2f8f6b"/>
