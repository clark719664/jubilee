<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900">
<!-- St Patrick's Day · back: misty emerald hills in the low evening sun, a ruined castle and a round tower on the far hills, patchwork fields divided by stone walls and hedges with tiny sheep; lighter than the sky and low in contrast -->
<defs><radialGradient id="st-patricks-day-sunglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff0b0" stop-opacity="0.45"/><stop offset="0.4" stop-color="#ffe08a" stop-opacity="0.14"/><stop offset="1" stop-color="#ffe08a" stop-opacity="0"/></radialGradient><linearGradient id="st-patricks-day-far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63b090"/><stop offset="1" stop-color="#4da280"/></linearGradient><linearGradient id="st-patricks-day-mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#50a483"/><stop offset="1" stop-color="#3a9673"/></linearGradient><linearGradient id="st-patricks-day-wisp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8fff0" stop-opacity="0"/><stop offset="0.3" stop-color="#f0fff4"/><stop offset="0.7" stop-color="#f0fff4"/><stop offset="1" stop-color="#e8fff0" stop-opacity="0"/></linearGradient><filter id="st-patricks-day-wsoft" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<!-- the low evening sun glowing from the upper left -->
<ellipse cx="160" cy="420" rx="520" ry="260" fill="url(#st-patricks-day-sunglow)"/>
