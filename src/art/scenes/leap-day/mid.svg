<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900">
<!-- Leap Day · mid. Concept: "leapfrog at the pond" on the bonus day, the first green of the year showing through the last snow. Focal points: three friends playing leapfrog on the bank, one vaulting clean over another with legs flung wide (x 120–380, y 600–810), and the pond with frogs on lily pads, one in a party hat and one mid-leap (x 420–1060, y 640–840). A big tear-off calendar on an easel stands open at 29 as the 28 flutters away; a little one in a frog raincoat hops along; snowdrops and crocuses, tadpoles, a robin singing in a budding tree, a snail. Light story: soft fresh early-spring light. The hopping frogs are the effect's. -->
<defs><linearGradient id="leap-day-grass" x2="0" y2="1"><stop stop-color="#8ac85a"/><stop offset="1" stop-color="#5a9a3a"/></linearGradient><linearGradient id="leap-day-pond" x2="0" y2="1"><stop stop-color="#7ac8d8"/><stop offset="1" stop-color="#3a8aa8"/></linearGradient><linearGradient id="leap-day-paper" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eef0f0"/></linearGradient></defs>
