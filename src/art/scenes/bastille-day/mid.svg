<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900">
<!-- Bastille Day · mid. Concept: "le quatorze juillet by the river" on a warm summer night in Paris. Focal point: the riverside quay (x 300–1100, y 560–870) where an accordionist in a striped shirt and beret plays by a lamp post while two children dance, and a family picnics with a baguette, cheese and strawberries, a girl waving a tricolor flag. A café with a red-and-white awning glows on the left; a boy rides past with a baguette in his bike basket; a little white poodle with a bow sits up to beg; a houseboat is moored on the river; tricolor bunting crosses the quay. The Eiffel Tower sparkles across the water on the right. Light story: lamplight and lit windows on a blue night. The fireworks are the effect's. -->
