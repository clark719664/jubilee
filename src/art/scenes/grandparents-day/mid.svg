<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900">
<!-- Grandparents Day · mid. Concept: "stories on the porch" on a golden early-September afternoon at grandma and grandpa's cottage. Focal point: grandpa and his grandson in matching straw hats lifting a giant prize tomato with a blue ribbon in the vegetable patch (x 1000–1420, y 560–880), and grandma on the porch swing showing her granddaughter an old photo album. A kitten tangles yarn from grandma's knitting basket; an apple tree with a birdhouse and a basket of picked apples; a sleepy old dog on the lawn; tall sunflowers; a blue watering can. Light story: warm golden afternoon sun. The floating hearts are the effect's. -->
