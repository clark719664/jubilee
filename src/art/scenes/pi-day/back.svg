<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900">
<!-- Pi Day · back: the school hall's huge chalkboard in a pale wooden frame on a chalkboard-green wall (the glyph-rain writes the π digits across it), a round wall clock and two hanging lamps outside the copy zone, eraser clouds only -->
<defs><linearGradient id="pi-day-board" x2="0" y2="1"><stop stop-color="#1b3535"/><stop offset="1" stop-color="#20413e"/></linearGradient><radialGradient id="pi-day-lamp"><stop stop-color="#fff3c4" stop-opacity=".5"/><stop offset=".4" stop-color="#fff3c4" stop-opacity=".16"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient></defs>
<!-- the chalkboard wall itself: a darker green panel with a pale wooden frame; the theme sky shows above it as the hall wall. Faint eraser clouds and tiny chalk dust only — the glyph-rain effect writes the digits. -->
<path d="M76 156q0-10 10-10l1428 0q10 0 10 10l0 288q0 10-10 10l-1428 0q-10 0-10-10z" fill="#d9c9a4"/><path d="M86 162q0-6 6-6l1416 0q6 0 6 6l0 276q0 6-6 6l-1416 0q-6 0-6-6z" fill="url(#pi-day-board)"/><path d="M601 330q50-18 100 0q-50 14-100 0zm262 63q50-18 100 0q-50 14-100 0zm33 10q50-18 100 0q-50 14-100 0zm-626-51q50-18 100 0q-50 14-100 0zm952-64q50-18 100 0q-50 14-100 0zm16 81q50-18 100 0q-50 14-100 0zm-1123-114q50-18 100 0q-50 14-100 0zm1179 4q50-18 100 0q-50 14-100 0zm-1126 45q50-18 100 0q-50 14-100 0zm1157-64q50-18 100 0q-50 14-100 0zm-1075-10q50-18 100 0q-50 14-100 0zm597 2q50-18 100 0q-50 14-100 0zm76-9q50-18 100 0q-50 14-100 0zm127 169q50-18 100 0q-50 14-100 0z" fill="#f2f2e9" opacity=".06"/>
<!-- a wall clock (a circle, of course) and two round hanging lamps outside the copy zone -->
<circle cx="140" cy="104" r="34" fill="#efe6d2"/><circle cx="140" cy="104" r="30" fill="#fff"/><circle cx="140" cy="104" r="3" fill="#1e3a3a"/><path d="M140 104l0-20m0 20l14 4" fill="none" stroke="#1e3a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M166 104l-4 0m1 13l-3-2m-7 12l-2-3m-11 6l0-4m-13 1l2-3m-12-7l3-2m-6-11l4 0m-1-13l3 2m7-12l2 3m11-6l0 4m13-1l-2 3m12 7l-3 2" fill="none" stroke="#1e3a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 0v60" fill="none" stroke="#8a8f85" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220" cy="92" r="70" fill="url(#pi-day-lamp)"/><path d="M190 60q30-14 60 0l-6 24q-24 10-48 0z" fill="#e8c97a"/><ellipse cx="220" cy="84" rx="24" ry="6" fill="#fff3c4"/><path d="M1380 0v60" fill="none" stroke="#8a8f85" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1380" cy="92" r="70" fill="url(#pi-day-lamp)"/><path d="M1350 60q30-14 60 0l-6 24q-24 10-48 0z" fill="#e8c97a"/><ellipse cx="1380" cy="84" rx="24" ry="6" fill="#fff3c4"/>
<!-- a floor plane so no sky shows below the wall if the mid layer is late -->
<rect x="-30" y="760" width="1660" height="170" fill="#8a6a3a"/>
</svg>
