<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900">
<!-- Independence Day (India) · mid. Concept: "kites over the rooftops" on a bright 15 August morning. Focal point: the family on their rooftop terrace (x 480–1460, y 380–860) — a boy in a white kurta flies a saffron kite high on the right while his sister holds the big wooden charkhi spool and laughs; grandpa in a white kurta and cap salutes the flag flying from a pole on the parapet; mum in a green sari with a saffron border brings a plate of jalebis and laddoos. A neighbour boy flies a green kite from the stairwell roof; a marigold garland on the blue door, a pigeon on the water tank, washing in saffron, white and green flapping on a line. Light story: bright morning sun. The fireworks and floating kites are the effect's. -->
