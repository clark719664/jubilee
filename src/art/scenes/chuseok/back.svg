<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900">
<!-- Chuseok · back: moonlight washing three layered ink-blue mountain ranges, kept low behind the copy; two far hanok hamlets with tiny lit windows; golden rice paddies in moonlight. The moon is the effect's. -->
<defs><radialGradient id="chuseok-moonwash"><stop stop-color="#fff4c2" stop-opacity=".2"/><stop offset=".5" stop-color="#fff4c2" stop-opacity=".07"/><stop offset="1" stop-color="#fff4c2" stop-opacity="0"/></radialGradient><linearGradient id="chuseok-paddy" x2="0" y2="1"><stop stop-color="#8a7a3a"/><stop offset="1" stop-color="#6a5e2e"/></linearGradient></defs>
<!-- moonlight washing the hills (the moon itself is the effect's) -->
<ellipse cx="1120" cy="560" rx="720" ry="240" fill="url(#chuseok-moonwash)"/>
<!-- three layered mountain ranges, palest furthest -->
<path d="M-20 520c100-50 180-68 260-50c80 18 120 0 200 30c120 40 260 56 380 52c140-4 240-32 340-62c100-30 200-50 300-38c80 10 120 28 160 38v210h-1640z" fill="#3a5288"/><path d="M-20 560c120-30 220-40 320-20c120 20 220 40 340 44c140 4 260-8 380-24c120-16 240-40 360-38c100 2 180 18 240 26v152h-1640z" fill="#2e4476"/><path d="M-20 590c160-14 320-6 480 4c180 10 360 12 540 6c180-6 380-16 620-12v112h-1640z" fill="#243a66"/>
