<path d="M424 600q46-10 92 0l-6-10q-40-12-80 0zm68 0q38-10 76 0l-6-10q-32-12-64 0zm714 0q44-10 88 0l-6-10q-38-12-76 0zm68 0q36-10 72 0l-6-10q-30-12-60 0zm56 0q40-10 80 0l-6-10q-34-12-68 0z" fill="#1a2a4a"/><path d="M449 606a3 3 0 1 0 5 0a3 3 0 1 0-5 0zm68 1a3 3 0 1 0 5 0a3 3 0 1 0-5 0zm716-1a3 3 0 1 0 5 0a3 3 0 1 0-5 0zm64 1a3 3 0 1 0 5 0a3 3 0 1 0-5 0zm66-1a3 3 0 1 0 5 0a3 3 0 1 0-5 0z" fill="#ffd98a"/>
<!-- golden rice paddies under the moon -->
<path d="M-20 612q820-12 1640 0v88h-1640z" fill="url(#chuseok-paddy)"/><path d="M-20 622q820-6.9 1640 2m-1640 12q820-6.8 1640 2m-1640 12q820-6.4 1640 2m-1640 12q820-6.5 1640 2" fill="none" stroke="#a8944a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
</svg>
