<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900">
<!-- Diwali · back: the city on the darkest night — a warm glow of lamps over a hazy far skyline strung with lights, hills dotted with village lights and a hill fort with lit ramparts, domes and a temple spire (architecture only); above it the phone’s sky carries only faint stars and far-off fireworks at ≤ .18 opacity; low contrast, tinted toward the plum sky -->
