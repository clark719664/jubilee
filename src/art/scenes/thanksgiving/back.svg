<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900">
<!-- Thanksgiving · back: the sun just setting behind hazy golden hills, patchwork fields with rows of red, orange and gold trees, a far little farm and a skein of geese flying south; low contrast, lighter than the sky and tinted toward its glow -->
<defs><radialGradient id="thanksgiving-sunglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe6a0" stop-opacity="0.75"/><stop offset="0.3" stop-color="#ffc35e" stop-opacity="0.32"/><stop offset="0.65" stop-color="#ff9a3e" stop-opacity="0.1"/><stop offset="1" stop-color="#ff9a3e" stop-opacity="0"/></radialGradient><radialGradient id="thanksgiving-sun" cx="0.45" cy="0.4" r="0.6"><stop offset="0" stop-color="#fffbe8"/><stop offset="0.6" stop-color="#ffe7a8"/><stop offset="1" stop-color="#ffcf6e"/></radialGradient><linearGradient id="thanksgiving-far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cd8952"/><stop offset="1" stop-color="#c27842"/></linearGradient><linearGradient id="thanksgiving-wisp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd9a0" stop-opacity="0"/><stop offset="0.3" stop-color="#ffe4b8"/><stop offset="0.7" stop-color="#ffe4b8"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></linearGradient><filter id="thanksgiving-soft" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="3"/></filter><linearGradient id="thanksgiving-near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c07640"/><stop offset="1" stop-color="#b6652f"/></linearGradient></defs>
<!-- the afterglow of the sun that has just set behind the far hills, right behind the supper table -->
<ellipse cx="800" cy="640" rx="860" ry="330" fill="url(#thanksgiving-sunglow)"/>
<!-- sunset cloud wisps, lit from below; at most 0.16 so the countdown stays readable -->
<g filter="url(#thanksgiving-soft)"><path d="M146 303q-6-3 1-3l406 4q7 0 0 2l-20 6q-7 2-14 2l-347-2q-7 0-13-3z" fill="url(#thanksgiving-wisp)" opacity="0.12"/><path d="M425 340q-5-2 0-2l290 4q5 0 0 1l-14 4q-5 1-10 1l-248-2q-5 0-10-2z" fill="url(#thanksgiving-wisp)" opacity="0.1"/><path d="M965 288q-5-2 1-2l368 4q6 0 0 2l-19 4q-5 2-11 2l-315-2q-6 0-12-2z" fill="url(#thanksgiving-wisp)" opacity="0.11"/><path d="M1105 332q-5-2 0-2l290 4q5 0 0 1l-14 4q-5 1-10 1l-248-2q-5 0-10-2z" fill="url(#thanksgiving-wisp)" opacity="0.09"/><path d="M625 407q-5-3 1-3l348 4q6 0 0 2l-17 4q-6 2-12 2l-297-2q-6 0-12-3z" fill="url(#thanksgiving-wisp)" opacity="0.14"/><path d="M864 432q-4-2 0-2l272 4q4 0 0 1l-14 3q-4 1-9 1l-232-2q-4 0-8-2z" fill="url(#thanksgiving-wisp)" opacity="0.13"/></g><path d="M692 444q4-4 8 2q4-6 8-2m-32 10q4-4 8 2q4-6 8-2m-32 10q4-4 8 2q4-6 8-2m32-10q4-4 8 2q4-6 8-2m0 10q4-4 8 2q4-6 8-2m-96 10q4-4 8 2q4-6 8-2m80 0q4-4 8 2q4-6 8-2" fill="none" stroke="#5c2c1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
<!-- far hills, hazy gold -->
<path d="M-20 470c23-3 93-21 140-18c47 3 90 16 140 34c50 18 110 55 160 74c50 19 93 29 140 38c47 9 100 11 140 14c40 3 67 4 100 4c33 0 60-3 100-6c40-3 93-5 140-14c47-9 93-22 140-40c47-18 93-48 140-66c47-18 90-37 140-40c50-3 133 17 160 20l0 435l-1640 0z" fill="url(#thanksgiving-far)"/>
