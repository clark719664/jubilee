<!-- a far farm and a skein of geese -->
<path d="M1380 560v-34l18-16l18 16v34zm40 0v-46a10 10 0 0 1 20 0v46z" fill="#b2602a"/><path d="M1411 297q5-3 9 3q4-6 9-3m6 12q5-3 9 3q4-6 9-3m6 12q5-3 9 3q4-6 9-3m-42-36q5-3 9 3q4-6 9-3m6-12q5-3 9 3q4-6 9-3m6 60q5-3 9 3q4-6 9-3" fill="none" stroke="#62301c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
